# Edit metadata for the studio registry. Keys must match ids built in ops.py (checked by tests/selfcheck).
# Every rationale is a DRAFT stating general tendencies, not guarantees: reviewed: false until the human owner signs off.
edits:
# ---- atom: substitution of a non-ring-carbon atom (ring carbons are excluded by ModifyAtom)
  - {id: atom_sub_c, name: Atom swap to C, category: atom, tags: [raises_logp], rationale: "Replacing a heteroatom with carbon generally removes polarity and tends to raise logP and lower TPSA.", reviewed: false}
  - {id: atom_sub_n, name: Atom swap to N, category: atom, tags: [adds_hbd, adds_hba, raises_tpsa], rationale: "Swapping in nitrogen tends to add a hydrogen-bond donor/acceptor and polarity, and can introduce a basic centre.", reviewed: false}
  - {id: atom_sub_o, name: Atom swap to O, category: atom, tags: [adds_hba, raises_tpsa, lowers_logp], rationale: "Oxygen is a hydrogen-bond acceptor; the swap tends to lower logP and raise TPSA relative to carbon.", reviewed: false}
  - {id: atom_sub_s, name: Atom swap to S, category: atom, tags: [raises_logp, raises_mw], rationale: "Sulfur is larger and more lipophilic than oxygen; swapping it in tends to raise logP and can add a metabolic soft spot.", reviewed: false}
  - {id: atom_sub_p, name: Atom swap to P, category: atom, tags: [raises_mw, exotic], rationale: "Phosphorus is uncommon in small-molecule drugs; exploratory swap that generally raises MW and polarity.", reviewed: false}
  - {id: atom_sub_f, name: Atom swap to F, category: atom, tags: [raises_logp, blocks_metabolism], rationale: "Fluorine terminates a position, often blocks oxidative metabolism and tends to modestly raise lipophilicity.", reviewed: false}
  - {id: atom_sub_cl, name: Atom swap to Cl, category: atom, tags: [raises_logp, raises_mw], rationale: "Chlorine caps the position with a lipophilic halogen; tends to raise logP and MW.", reviewed: false}
  - {id: atom_sub_br, name: Atom swap to Br, category: atom, tags: [raises_logp, raises_mw], rationale: "Bromine caps the position with a larger lipophilic halogen; generally raises logP and MW more than Cl.", reviewed: false}
  - {id: atom_sub_i, name: Atom swap to I, category: atom, tags: [raises_logp, raises_mw, exotic], rationale: "Iodine is heavy and lipophilic; usually raises MW and logP substantially and is rarely desirable in leads.", reviewed: false}
  - {id: atom_sub_b, name: Atom swap to B, category: atom, tags: [exotic], rationale: "Boron appears in a few drugs (boronic acids); exploratory swap with hard-to-predict property effects.", reviewed: false}
  - {id: atom_sub_si, name: Atom swap to Si, category: atom, tags: [raises_logp, exotic], rationale: "Silicon is a carbon isostere that tends to raise lipophilicity; exploratory, seldom used in practice.", reviewed: false}
# ---- atom: add a new atom on an existing atom
  - {id: atom_add_c, name: Add C atom, category: atom, tags: [raises_logp, raises_mw], rationale: "Adding a carbon extends the scaffold and tends to raise lipophilicity and MW.", reviewed: false}
  - {id: atom_add_n, name: Add N atom, category: atom, tags: [adds_hbd, adds_hba, raises_tpsa], rationale: "Adding nitrogen tends to add polarity and a hydrogen-bond donor/acceptor.", reviewed: false}
  - {id: atom_add_o, name: Add O atom, category: atom, tags: [adds_hba, raises_tpsa, lowers_logp], rationale: "Adding oxygen (hydroxyl or ether-like) tends to lower logP and raise TPSA.", reviewed: false}
  - {id: atom_add_s, name: Add S atom, category: atom, tags: [raises_logp, raises_mw], rationale: "Adding sulfur tends to raise lipophilicity and MW and can add a metabolic soft spot.", reviewed: false}
  - {id: atom_add_p, name: Add P atom, category: atom, tags: [raises_mw, exotic], rationale: "Adding phosphorus is an unusual, exploratory change that generally raises MW.", reviewed: false}
  - {id: atom_add_f, name: Add F atom, category: atom, tags: [raises_logp, blocks_metabolism], rationale: "Adding fluorine (where valence allows) often blocks metabolism and modestly raises lipophilicity.", reviewed: false}
  - {id: atom_add_cl, name: Add Cl atom, category: atom, tags: [raises_logp, raises_mw], rationale: "Adding chlorine tends to raise logP and MW.", reviewed: false}
  - {id: atom_add_br, name: Add Br atom, category: atom, tags: [raises_logp, raises_mw], rationale: "Adding bromine generally raises logP and MW more than chlorine.", reviewed: false}
  - {id: atom_add_i, name: Add I atom, category: atom, tags: [raises_logp, raises_mw, exotic], rationale: "Adding iodine usually raises MW and logP substantially and is rarely desirable in leads.", reviewed: false}
  - {id: atom_add_b, name: Add B atom, category: atom, tags: [exotic], rationale: "Adding boron is exploratory with hard-to-predict property effects.", reviewed: false}
  - {id: atom_add_si, name: Add Si atom, category: atom, tags: [raises_logp, exotic], rationale: "Adding silicon tends to raise lipophilicity; exploratory and rarely used.", reviewed: false}
  - {id: atom_remove, name: Remove atom, category: atom, tags: [lowers_mw, simplifies], rationale: "Deleting an atom lowers MW and can simplify the molecule; effect on logP/TPSA depends on which atom goes.", reviewed: false}
# ---- bond
  - {id: bond_add_single, name: "Add single bond (ring closure)", category: bond, tags: [adds_ring, rigidifies, lowers_rotb], rationale: "Closing a ring with a new single bond rigidifies the molecule and tends to reduce rotatable bonds, at the cost of synthetic complexity.", reviewed: false}
  - {id: bond_add_double, name: "Add double bond (ring closure)", category: bond, tags: [adds_ring, rigidifies, lowers_rotb], rationale: "A new double bond that closes a ring is a rigid, unsaturated link; tends to reduce flexibility and Fsp3.", reviewed: false}
  - {id: bond_add_triple, name: "Add triple bond (ring closure)", category: bond, tags: [adds_ring, exotic], rationale: "A triple bond in a new ring is strained for small rings; exploratory and rarely sensible.", reviewed: false}
  - {id: bond_add_aromatic, name: "Add aromatic bond (ring closure)", category: bond, tags: [adds_ring, exotic], rationale: "Joins atoms with an aromatic bond; only valid in contexts that complete an aromatic ring, so often inapplicable.", reviewed: false}
  - {id: bond_remove, name: "Remove bond (ring opening)", category: bond, tags: [opens_ring, raises_rotb, raises_fsp3], rationale: "Breaking a ring bond adds flexibility and tends to raise rotatable bonds and Fsp3; acyclic bonds are rejected because they would split the molecule.", reviewed: false}
  - {id: bond_to_single, name: Change bond order to single, category: bond, tags: [saturates, raises_fsp3], rationale: "Reducing a multiple bond to single saturates the link and tends to raise Fsp3 and conformational flexibility.", reviewed: false}
  - {id: bond_to_double, name: Change bond order to double, category: bond, tags: [unsaturates, rigidifies], rationale: "Raising a bond to double adds unsaturation and rigidity; can introduce a conjugated or Michael-acceptor motif.", reviewed: false}
  - {id: bond_to_triple, name: Change bond order to triple, category: bond, tags: [unsaturates, rigidifies, exotic], rationale: "A triple bond is linear and rigid; typically only sensible for nitriles or alkynes.", reviewed: false}
  - {id: bond_to_aromatic, name: Change bond order to aromatic, category: bond, tags: [exotic], rationale: "Marks a bond aromatic; valid only where an aromatic ring results, so rarely applicable.", reviewed: false}
# ---- bioisostere
  - {id: bio_acid_to_tetrazole, name: Carboxylic acid -> tetrazole, category: bioisostere, tags: [keeps_acidity, raises_logp, raises_tpsa], rationale: "Tetrazole is a classic carboxylic acid mimic with similar acidity and generally somewhat higher lipophilicity.", reviewed: false}
  - {id: bio_acid_to_phosphonic, name: Carboxylic acid -> phosphonic acid, category: bioisostere, tags: [keeps_acidity, lowers_logp, raises_tpsa, adds_hbd], rationale: "Phosphonic acid mimics a carboxylate but is more polar and doubly ionisable, which tends to lower permeability.", reviewed: false}
  - {id: bio_amine_to_pyridyl, name: Amine -> pyridyl, category: bioisostere, tags: [removes_hbd, adds_aromatic_ring, lowers_basicity], rationale: "Replacing a basic amine with a pyridyl ring removes the donor and strong basicity while adding an aromatic acceptor.", reviewed: false}
  - {id: bio_amide_to_sulfonamide, name: Amide -> sulfonamide, category: bioisostere, tags: [raises_tpsa, raises_mw, improves_stability], rationale: "Sulfonamides mimic amide geometry with different acidity and often better hydrolytic stability; they tend to raise TPSA and MW.", reviewed: false}
  - {id: bio_amide_to_retroamide, name: Amide -> retro-amide, category: bioisostere, tags: [keeps_formula, alters_hbond_vector], rationale: "Reversing the amide keeps composition but flips donor/acceptor directions, which can change binding and metabolic stability.", reviewed: false}
  - {id: bio_phenyl_to_pyridyl, name: Phenyl -> pyridyl, category: bioisostere, tags: [lowers_logp, raises_tpsa, adds_hba], rationale: "Swapping phenyl for pyridyl typically lowers logP and adds a hydrogen-bond acceptor, often improving solubility.", reviewed: false}
  - {id: bio_phenyl_to_thiophene, name: Phenyl -> thiophene, category: bioisostere, tags: [similar_logp, smaller_ring], rationale: "Thiophene is a classical phenyl isostere of similar lipophilicity and size; may add a metabolic liability.", reviewed: false}
  - {id: bio_phenyl_to_furan, name: Phenyl -> furan, category: bioisostere, tags: [lowers_logp, adds_hba, adds_alert_risk], rationale: "Furan is a smaller, more polar aromatic ring but is a known metabolic-activation risk.", reviewed: false}
  - {id: bio_phenyl_to_pyrrole, name: Phenyl -> pyrrole, category: bioisostere, tags: [lowers_logp, adds_hbd], rationale: "Pyrrole adds an NH donor and tends to lower logP but is electron-rich and oxidation-prone.", reviewed: false}
# ---- functional group: remove
  - {id: fg_remove_methyl, name: Remove methyl, category: functional_group, tags: [lowers_logp, lowers_mw], rationale: "Dropping a methyl lowers MW and lipophilicity, and can relieve steric clashes or remove a metabolic soft spot.", reviewed: false}
  - {id: fg_remove_hydroxyl, name: Remove hydroxyl, category: functional_group, tags: [removes_hbd, raises_logp, lowers_tpsa], rationale: "Removing a hydroxyl tends to raise logP, lower TPSA and remove a donor, often improving permeability.", reviewed: false}
  - {id: fg_remove_amino, name: Remove amino, category: functional_group, tags: [removes_hbd, raises_logp, lowers_tpsa, removes_basic_centre], rationale: "Removing an NH2 lowers TPSA and removes a donor and basic centre; tends to raise logP.", reviewed: false}
  - {id: fg_remove_carboxyl, name: Remove carboxyl, category: functional_group, tags: [removes_acid, removes_hbd, raises_logp, lowers_tpsa], rationale: "Removing a carboxylic acid removes the ionisable group, generally raising logP and lowering TPSA.", reviewed: false}
  - {id: fg_remove_carbonyl, name: Remove carbonyl, category: functional_group, tags: [removes_hba, lowers_tpsa], rationale: "Removing a carbonyl takes out a hydrogen-bond acceptor and lowers TPSA; applies only to singly attached C=O.", reviewed: false}
  - {id: fg_remove_aldehyde, name: Remove aldehyde, category: functional_group, tags: [removes_alert, removes_hba, lowers_tpsa], rationale: "Aldehydes are reactive and commonly flagged; removing one tends to clear the alert and lower TPSA.", reviewed: false}
  - {id: fg_remove_ketone, name: Remove ketone, category: functional_group, tags: [removes_hba, lowers_tpsa], rationale: "Removing a ketone drops an acceptor and lowers TPSA; the matched group includes its carbon-substituent pattern, so effects vary.", reviewed: false}
  - {id: fg_remove_ether, name: Remove ether, category: functional_group, tags: [removes_hba, lowers_tpsa], rationale: "Removing an ether oxygen drops a weak acceptor and lowers TPSA; applies only to singly attached matches.", reviewed: false}
  - {id: fg_remove_ester, name: Remove ester, category: functional_group, tags: [removes_hba, lowers_tpsa, improves_stability], rationale: "Removing an ester eliminates a hydrolytically labile group and lowers TPSA and MW.", reviewed: false}
  - {id: fg_remove_amide, name: Remove amide, category: functional_group, tags: [removes_hba, lowers_tpsa, lowers_mw], rationale: "Removing an amide cuts polarity and MW; may remove a key binding interaction.", reviewed: false}
  - {id: fg_remove_nitro, name: Remove nitro, category: functional_group, tags: [removes_alert, lowers_tpsa, lowers_mw], rationale: "Aromatic nitro groups are common structural alerts; removing one tends to clear the alert and lower TPSA.", reviewed: false}
  - {id: fg_remove_cyano, name: Remove cyano, category: functional_group, tags: [removes_hba, lowers_tpsa], rationale: "Removing a nitrile drops a small polar acceptor and lowers TPSA and MW.", reviewed: false}
  - {id: fg_remove_thiol, name: Remove thiol, category: functional_group, tags: [removes_alert, removes_hbd], rationale: "Thiols are reactive and metabolically labile; removing one tends to clear alerts and a donor.", reviewed: false}
  - {id: fg_remove_halogen, name: Remove halogen, category: functional_group, tags: [lowers_logp, lowers_mw], rationale: "Removing a halogen generally lowers logP and MW but may expose a metabolic site.", reviewed: false}
  - {id: fg_remove_azide, name: Remove azide, category: functional_group, tags: [removes_alert, lowers_mw], rationale: "Azides are energetic and flagged as alerts; removing one tends to clear the alert.", reviewed: false}
  - {id: fg_remove_sulfonamide, name: Remove sulfonamide, category: functional_group, tags: [lowers_tpsa, removes_hbd, lowers_mw], rationale: "Removing a sulfonamide lowers TPSA, MW and donor count; may remove a key binding group.", reviewed: false}
# ---- functional group: interconvert
  - {id: fg_hydroxyl_to_amino, name: Hydroxyl -> amino, category: functional_group, tags: [adds_hbd, adds_basic_centre, lowers_logp], rationale: "OH to NH2 adds a donor and a basic centre and tends to lower logP.", reviewed: false}
  - {id: fg_hydroxyl_to_thiol, name: Hydroxyl -> thiol, category: functional_group, tags: [raises_logp, adds_alert_risk], rationale: "OH to SH generally raises lipophilicity but introduces a reactive, metabolically labile group.", reviewed: false}
  - {id: fg_hydroxyl_to_methyl, name: Hydroxyl -> methyl, category: functional_group, tags: [removes_hbd, raises_logp, lowers_tpsa], rationale: "Replacing OH with methyl removes a donor/acceptor and tends to raise logP and lower TPSA.", reviewed: false}
  - {id: fg_hydroxyl_to_halogen, name: Hydroxyl -> halogen, category: functional_group, tags: [removes_hbd, raises_logp, lowers_tpsa], rationale: "OH to halogen removes a donor and generally raises logP and lowers TPSA.", reviewed: false}
  - {id: fg_amino_to_hydroxyl, name: Amino -> hydroxyl, category: functional_group, tags: [removes_basic_centre, lowers_basicity], rationale: "NH2 to OH removes the basic centre and typically leaves polarity similar.", reviewed: false}
  - {id: fg_amino_to_amide, name: Amino -> amide, category: functional_group, tags: [removes_basic_centre, raises_tpsa, raises_mw], rationale: "Converting an amine to an amide removes basicity and tends to raise TPSA and MW.", reviewed: false}
  - {id: fg_carboxyl_to_ester, name: Carboxyl -> ester, category: functional_group, tags: [removes_acid, removes_hbd, raises_logp, lowers_tpsa], rationale: "Esterifying an acid removes the ionisable group and tends to raise logP and permeability; esters can be hydrolysed in vivo.", reviewed: false}
  - {id: fg_carboxyl_to_amide, name: Carboxyl -> amide, category: functional_group, tags: [removes_acid, adds_hbd], rationale: "Acid to amide removes the charge and adds a donor, generally improving permeability.", reviewed: false}
  - {id: fg_aldehyde_to_ketone, name: Aldehyde -> ketone, category: functional_group, tags: [removes_alert, raises_logp], rationale: "Ketones are generally less reactive than aldehydes; the swap tends to clear the aldehyde alert and slightly raise logP.", reviewed: false}
  - {id: fg_aldehyde_to_carboxyl, name: Aldehyde -> carboxyl, category: functional_group, tags: [removes_alert, adds_acid, lowers_logp, raises_tpsa], rationale: "Oxidising an aldehyde to an acid clears the alert but adds an ionisable group, lowering logP and raising TPSA.", reviewed: false}
  - {id: fg_thiol_to_hydroxyl, name: Thiol -> hydroxyl, category: functional_group, tags: [removes_alert, lowers_logp, raises_tpsa], rationale: "SH to OH removes a reactive thiol and tends to lower logP and raise TPSA.", reviewed: false}
  - {id: fg_cyano_to_carboxyl, name: Cyano -> carboxyl, category: functional_group, tags: [adds_acid, adds_hbd, lowers_logp, raises_tpsa], rationale: "Nitrile to acid adds an ionisable group and donor, lowering logP and raising TPSA.", reviewed: false}
  - {id: fg_nitro_to_amino, name: Nitro -> amino, category: functional_group, tags: [removes_alert, adds_hbd, lowers_logp], rationale: "Reducing nitro to amine clears the nitro alert and adds a donor, though anilines can carry their own alerts.", reviewed: false}
  - {id: fg_ester_to_carboxyl, name: Ester -> carboxyl, category: functional_group, tags: [adds_acid, adds_hbd, lowers_logp, raises_tpsa], rationale: "Hydrolysing an ester to the acid adds an ionisable group and lowers logP, often reducing permeability.", reviewed: false}
  - {id: fg_amide_to_carboxyl, name: Amide -> carboxyl, category: functional_group, tags: [adds_acid, lowers_logp], rationale: "Amide to acid swaps a neutral polar group for an ionisable one, tending to lower logP.", reviewed: false}
# ---- functional group: add
  - {id: fg_add_methyl, name: Add methyl, category: functional_group, tags: [raises_logp, raises_mw], rationale: "Adding a methyl tends to raise logP slightly and can fill a pocket or block metabolism.", reviewed: false}
  - {id: fg_add_hydroxyl, name: Add hydroxyl, category: functional_group, tags: [adds_hbd, adds_hba, lowers_logp, raises_tpsa], rationale: "Adding OH tends to lower logP, raise TPSA and improve solubility.", reviewed: false}
  - {id: fg_add_amino, name: Add amino, category: functional_group, tags: [adds_hbd, adds_basic_centre, lowers_logp, raises_tpsa], rationale: "Adding NH2 generally lowers logP, raises TPSA and may add a basic centre.", reviewed: false}
  - {id: fg_add_halogen, name: Add halogen (Cl), category: functional_group, tags: [raises_logp, blocks_metabolism], rationale: "Adding chlorine tends to raise logP and can block a metabolic site.", reviewed: false}
  - {id: fg_add_cyano, name: Add cyano, category: functional_group, tags: [adds_hba, raises_tpsa], rationale: "A nitrile adds a small polar acceptor with modest effect on size.", reviewed: false}
  - {id: fg_add_carboxyl, name: Add carboxyl, category: functional_group, tags: [adds_acid, adds_hbd, lowers_logp, raises_tpsa], rationale: "Adding a carboxylic acid lowers logP and raises TPSA; improves solubility but can hurt permeability.", reviewed: false}
  - {id: fg_add_ether, name: Add methoxy, category: functional_group, tags: [adds_hba, raises_tpsa], rationale: "A methoxy group adds a weak acceptor with small effect on logP; common metabolic O-demethylation site.", reviewed: false}
  - {id: fg_add_ketone, name: Add acetyl, category: functional_group, tags: [adds_hba, raises_tpsa, lowers_logp], rationale: "An acetyl group adds a hydrogen-bond acceptor and tends to lower logP slightly.", reviewed: false}
  - {id: fg_add_amide, name: Add carboxamide, category: functional_group, tags: [adds_hbd, adds_hba, lowers_logp, raises_tpsa], rationale: "A primary amide adds donor and acceptor, tending to lower logP and raise TPSA.", reviewed: false}
  - {id: fg_add_sulfonamide, name: Add sulfonamide, category: functional_group, tags: [adds_hbd, adds_hba, lowers_logp, raises_tpsa], rationale: "A sulfonamide is a polar donor/acceptor group that tends to lower logP and raise TPSA.", reviewed: false}
  - {id: fg_add_sulfone, name: Add methylsulfone, category: functional_group, tags: [adds_hba, lowers_logp, raises_tpsa], rationale: "A methylsulfone is a polar, metabolically stable acceptor that tends to lower logP and raise TPSA.", reviewed: false}
