[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphdqn"
version = "0.1.0"
description = "Graph-based RL (DQN and PPO) for multi-objective molecular optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.6",
    "torch_geometric",
    "rdkit",
    "transformers",
    "onnxruntime",
    "diskcache",
    "tqdm",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "networkx",
    "gymnasium",
    "matplotlib",
    "seaborn",
    "chemprop",
    "descriptastorus",
    "ray[tune]",
    "optuna",
    "wandb",
    "typed-argument-parser",
]

[project.optional-dependencies]
webapp = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "streamlit>=1.38,<2",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
include = [
    "dqn*",
    "ppo*",
    "ADMET*",
    "binding_module*",
    "molecular_modifications*",
    "synthetic_accessibility*",
    "reward*",
    "experiments*",
    "all_experiments*",
    "webapp*",
]
